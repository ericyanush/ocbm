[package]
name = "ocbmd"
version = "0.1.0"
edition = "2021"
description = "Box-side OCBM daemon (armv7/musl): owns /dev/usb_accessory; CTRL/ECHO/CONSOLE/MFI channels"

[[bin]]
name = "ocbmd"
path = "src/main.rs"

[dependencies]
mfi-i2c-local = { path = "../../crates/vendor/mfi-i2c-local" }
ocbm-proto = { path = "../../crates/ocbm-proto" }
box-common = { path = "../../crates/box-common" }
libc = "0.2"
carplay-start-session = { path = "../../crates/carplay-start-session" }
serde_json = "1"
